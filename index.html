tes a successful business from an unsuccessful one, and a fresh look attracts more customers.","Lotus Janitorial has over 10 years of experience in commercial cleaning in Calgary. We serve restaurants, banquet halls, retirement homes and five-star hotels, with the expertise and equipment to exceed your expectations at a competitive rate."],sections:[{h:"How commercial cleaning benefits you",list:["Make the best first impression: clients notice your service, not your floors.","Focus your energy on your business while we handle the cleaning.","A happier, more productive environment: clean workspaces mean content staff.","Service guarantees and quality assurance make hiring us a risk-free choice.","Safety: we eliminate airborne dust and contaminants that cause workplace illness."]},{h:"Commercial cleaning on your schedule",p:"Need a one-time clean or a daily package? We offer flexible agreements at the best possible prices, and our representatives give you accurate quotes. We'll transform your commercial space into an enjoyable, productive environment, leaving it with sparkle and shine."}]},{slug:"janitorial-services",title:"Janitorial Services",icon:ol,short:"24/7 janitorial operations built around the unique needs of your building.",intro:["A clean space to work in enhances productivity, brings freshness and lowers stress. We offer 24/7 janitorial operations tailored to the unique needs of your building and operations.","Forget the stress of keeping up with dirt, clutter and dust yourself. With our team, a clean work environment is always a reality."],sections:[{h:"Our services include",list:["General janitorial services","Cleaning and washroom products","Floor cleaning and refurbishing","Light and vent cleaning","Pressure washing"]}]},{slug:"retail-cleaning",title:"Retail Cleaning",icon:nl,short:"Retail centres, restaurants and convention centres that look their best for every shopper.",intro:["Retail centres, grocery stores, restaurants and convention centres need ary you always dreamed of.",intro:["We carefully select and train all of our cleaning employees so your home is cleaned carefully and thoroughly. If you're ever not satisfied, contact us within 24 hours and a team will return to correct the problem at no charge."],sections:[{h:"Green cleaning, by people you can trust",p:"Our cleaners are fully trained in-house on natural, eco-friendly products. It's our way of protecting your home, your family, your pets and the environment."}]},{slug:"floor-maintenance",title:"Floor Maintenance",icon:kr,short:"Stripping, sealing, refinishing and waxing for every hard surface floor.",intro:["We provide a full range of services for vinyl, linoleum, hardwood, ceramic, tile and natural stone floors, using non-toxic, non-flammable, biodegradable products. We make specific recommendations after evaluating your floor's condition."],sections:[{h:"Vinyl floor stripping, refinishing & sealing",p:"We remove old wax build-up and sealer, reseal and buff to a sparkling shine. The durable finish reduces marks and scratches and extends the life of your floor."},{h:"Hardwood floor refinishing",p:"We protect and fortify wood floors by sanding or screening and applying new polyurethane to remove scratches, dents and water stains."},{h:"Natural stone restoration",p:"Grinding, honing, diamondizing and crystallizing terrazzo, marble, granite, limestone and slate, then sealing against water, oil and dirt."},{h:"Waxing",p:"Regular cleaning and waxing keeps high-traffic floors shiny and lessens everyday wear and tear."}]},{slug:"window-cleaning",title:"Window Cleaning",icon:Vi,short:"Streak-free glass, without the ladders, the danger or the wasted afternoon.",intro:["Just the thought of cleaning your windows can make your skin crawl. It's time-consuming, dangerous, and streak-free results are incredibly difficult no matter what tricks you use.","We use the latest technology to give even the toughest windows a spot- and streak-free shine. Looking for window cleaning and pressure washing in Calgary? Look no further."],sections:[]},{slug:"pressure-wash-services",title:"Pressure Wash Services",icon:ji,short:"Strip away years of mould, grime, oil and grease from parkades and warehouses.",intro:["Strip away years of mould, grime, oil, grease and other contaminants. In busy parking lots, parkades and warehouses, cleaning gets overlooked, which leads to dirty conditions and can pose a safety risk.","Give your facility a facelift and a clean slate. Contact us for a free pressure washing quote."],sections:[]},{slug:"parking-cleaning-services",title:"Parking Cleaning Services",icon:Tr,short:"Parkades, lots and industrial plants restored in one quick visit.",intro:["If your warehouse, distribution centre, industrial plant, parkade or parking lot is overdue, our pressure washing removes everything that's accumulated in one quick visit: walls, doors, floors, ceilings and equipment."],sections:[{h:"Safe for your infrastructure",p:"We pressure wash steel, concrete, masonry and asphalt without harming critical infrastructure. Our technicians hold fall protection certification and are trained on numerous aerial platform machines."}]},{slug:"disinfectant-services",title:"Disinfectant Services",icon:rl,short:"Contact-point disinfection so employees and customers feel safe.",intro:["Viral and bacterial pathogens pose a constant, unseen threat. Our disinfection service helps your business achieve the highest level of hygiene and the peace of mind that operations are running smoothly."],sections:[{h:"Areas we treat",list:["Door handles, railings & light switches","Elevator buttons & railings","Lobbies, common areas & furniture contact points","Washroom partitions, faucets, dispensers & hand dryers","Lunchrooms: counters, fridge handles & microwaves","Water fountains & stations"]},{h:"What we use",p:"VitalOxide\u2122, classified by the EPA as practically non-toxic, with proven effectiveness against many viruses and bacteria."},{h:"Flexible
